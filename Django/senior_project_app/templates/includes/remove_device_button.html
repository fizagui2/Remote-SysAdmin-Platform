<form method="post" action="{% url 'remove_device' device.pk %}" onsubmit="return confirm('Remove {{ device.hostname|escapejs }}? Its agent will stop being able to report until it enrolls again.');">
    {% csrf_token %}
    <button type="submit" class="stop-service banner-button banner-button-secondary bolded"><i class="bi bi-trash"></i>Remove</button>
</form>
