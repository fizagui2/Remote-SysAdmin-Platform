{% extends 'base.html' %}
{% load static %}
{% block title %} 👤Login👤 {% endblock %}

{% block extra_js %}
<script src="{% static 'js/login_view.js' %}" defer></script>
{% endblock %}

{% block content %}
<div class="container-sm text-center login-container">
    <h1 class="login-header">Sign in</h1>
    <div class="row mb-4" data-mdb-input-initialized="true">
        <label class="form-label col login-text" for="typeEmailX-2"><b>Email</b></label>
        <input type="email" id="typeEmailX-2" class="form-control form-control-lg col-6">
    </div>

    <div class="form-outline mb-4 row" data-mdb-input-initialized="true">
        <label class="form-label col login-text" for="typePasswordX-2"><b>Password</b></label>
        <input type="password" id="passwordField" class="form-control form-control-lg col-6">
        <div class="form-notch">
            <div class="form-notch-leading" style="width: 9px;"></div>
            <div class="form-notch-middle" style="width: 64px;"></div>
            <div class="form-notch-trailing"></div>
        </div>
    </div>
    <!-- Remember password -->
    <div class="form-check d-flex justify-content-start mb-4">
        <input class="form-check-input" type="checkbox" id="rememberPassword">
        <label class="form-check-label" for="rememberPassword"> Remember password </label>
    </div>

    <!-- Show password -->
    <div class="form-check d-flex justify-content-start mb-4">
        <input class="form-check-input" type="checkbox" id="toggleButton">
        <label class="form-check-label" for="toggleButton">Show password</label>
    </div>
    
    <!-- Login Buttons -->
    <div>
        <button class="btn secondary-button rounded-pill px-3" type="submit">Login</button>
        <button class="btn secondary-button rounded-pill px-3" type="submit"><i class="fab fa-google me-2"></i>Sign in with google</button>
    </div>
</div>
{% endblock %}
