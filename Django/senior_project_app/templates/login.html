{% extends 'base.html' %}
{% block title %} 👤Login👤 {% endblock %}
{% block content %}
<div class="container-sm text-center login-container">
    <h1>Sign in</h1>
    <div class="row mb-4" data-mdb-input-initialized="true">
        <label class="form-label col" for="typeEmailX-2">Email</label>
        <input type="email" id="typeEmailX-2" class="form-control form-control-lg col-6">
    </div>

    <div class="form-outline mb-4 row" data-mdb-input-initialized="true">
        <label class="form-label col" for="typePasswordX-2">Password</label>
        <input type="password" id="typePasswordX-2" class="form-control form-control-lg col-6">
        <div class="form-notch">
            <div class="form-notch-leading" style="width: 9px;"></div><div class="form-notch-middle" style="width: 64px;"></div>
            <div class="form-notch-trailing"></div>
        </div>
    </div>

    <div class="form-check d-flex justify-content-start mb-4">
        <input class="form-check-input" type="checkbox" value="" id="form1Example3">
        <label class="form-check-label" for="form1Example3"> Remember password </label>
    </div>
    <div>
        <button data-mdb-button-init="" data-mdb-ripple-init="" class="btn secondary-button rounded-pill px-3" type="submit" data-mdb-button-initialized="true">Login</button>
        <button class="btn secondary-button rounded-pill px-3" type="submit" data-mdb-button-initialized="true"><i class="fab fa-google me-2"></i> Sign in with google</button>
    </div>
</div>
{% endblock %}
