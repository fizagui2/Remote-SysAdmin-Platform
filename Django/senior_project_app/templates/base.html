{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shorcut icon" type="x-icon" href="{% static 'images/RSA-logo.png' %}">
    <title>{% block title %} Homepage {% endblock%}</title>
    <!--Scripts-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/darkmode.js' %}" defer></script>
    {% block extra_js %} {% endblock %}
    <!--CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/general_stuff.css' %}">
    <link rel="stylesheet" href="{% static 'css/buttons_styles.css'%}">
    <link rel="stylesheet" href="{% static 'css/navbar_styles.css'%}">
    {% block extra_css %} {% endblock %}
</head>

<body>
    {% include 'includes/navbar.html' %}
    {% block content %} {% endblock %}
    {% include 'includes/footer.html' %}
</body>
</html>
